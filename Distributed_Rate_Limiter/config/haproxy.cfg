global
    log stdout format raw local0


resolvers docker
    nameserver dns1 127.0.0.11:53
    

defaults
    log     global
    mode    http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms


# Public API Entrypoint
frontend api_gateway_frontend
    bind *:8080
    # [TODO] Currently routing to mock backend. Later, need to change to C++ cluster
    option forwardfor
    default_backend mock_backend_cluster


# Internal Load Balancing Group
backend cpp_backend
    balance roundrobin
    server gateway_cluster cpp-gateway:8000 check resolvers docker init-addr libc,none


# HA Proxy Admin Dashboard 
listen stats
    bind *:1936
    mode http
    stats enable
    stats uri /
    stats refresh 5s 
