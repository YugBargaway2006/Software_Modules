services:

    # Ingestion Layer with Layer 7 Load Balancer
    haproxy:
        image: haproxy:3.0-alpine
        container_name: haproxy_lb
        ports:
            - "8080:8080"   # User Level Access Ports
            - "1936:1936"   # HAProxy Stats Dashboard
        volumes:
            - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        networks:
            - limited_network
        depends_on:
            - cpp-gateway-1
            - cpp-gateway-2

    
    # Coordination for Distributed Consensus
    zookeeper:
        image: zookeeper:3.9
        container_name: zookeeper_consensus
        ports:
            - "2181:2181"
        networks:
            - limited_network

    
    # In-memory cache for high performance
    redis:
        image: redis:7.2-alpine
        container_name: redis_state
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        networks:
            - limited_network

    
    # C++ compiled container cluster backend
    cpp-gateway-1:
        build:
            context: ./gateway
            dockerfile: Dockerfile
        container_name: cpp_gateway_node_1
        networks:
            - limited_network

    
    # Parallel Horizontal Scaling container
    cpp-gateway-2:
        build:
            context: ./gateway
            dockerfile: Dockerfile
        container_name: cpp_gateway_node_2
        networks:
            - limited_network


networks:
    limited_network:
        driver: bridge
